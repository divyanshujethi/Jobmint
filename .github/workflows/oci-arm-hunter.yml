name: OCI Ampere A1 Hunter

on:
  workflow_dispatch: # Manual trigger only (prevents GitHub automated abuse flags)

concurrency:
  group: oci-hunter
  cancel-in-progress: false

jobs:
  hunt:
    name: Polite OCI Probe for A1 Capacity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install OCI CLI
        run: |
          pip install --upgrade oci-cli

      - name: Configure OCI CLI Credentials
        run: |
          mkdir -p ~/.oci
          # Support both secret names: OCI_KEY_FILE or OCI_API_KEY
          KEY_CONTENT="${{ secrets.OCI_KEY_FILE || secrets.OCI_API_KEY }}"
          echo "$KEY_CONTENT" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=~/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION || 'ap-mumbai-1' }}
          EOF
          chmod 600 ~/.oci/config

      - name: Run Hunter Script
        id: hunter
        env:
          OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
          OCI_IMAGE_OCID: ${{ secrets.OCI_IMAGE_OCID }}
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
        run: |
          python .github/scripts/oci_arm_hunter.py

      - name: Auto-Disable Hunter Upon Success
        if: steps.hunter.outputs.instance_acquired == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🎉 Instance + 200 GB Storage acquired! Disabling workflow so it stops permanently."
          gh workflow disable oci-arm-hunter.yml || true
