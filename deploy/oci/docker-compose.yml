version: '3.8'

services:
  # 1. PostgreSQL 16 (Relational Database on OCI 200 GB SSD)
  postgres:
    image: postgres:16-alpine
    container_name: jobmint-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-jobmint}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-JobMintSecurePass2026!}
      POSTGRES_DB: ${DB_NAME:-jobmint_prod}
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jobmint} -d ${DB_NAME:-jobmint_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4096M

  # 2. Redis 7 (Cache, Rate Limiting & Queue on OCI SSD)
  redis:
    image: redis:7-alpine
    container_name: jobmint-redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:-JobMintRedisPass2026!}
    volumes:
      - /data/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-JobMintRedisPass2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2048M

  # 3. Ollama (Self-Hosted Llama 3.2 3B Inference Engine on ARM Neoverse-N1)
  ollama:
    image: ollama/ollama:latest
    container_name: jobmint-ollama
    restart: always
    environment:
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=1
    volumes:
      - /data/ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 8192M

networks:
  default:
    name: jobmint-network