version: '3.8'

services:
  # 1. PostgreSQL 16 (Relational Database on OCI 200 GB SSD)
  postgres:
    image: postgres:16-alpine
    container_name: jobmint-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-jobmint}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-JobMintSecurePass2026!}
      POSTGRES_DB: ${DB_NAME:-jobmint_prod}
    volumes:
      - /data/postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jobmint} -d ${DB_NAME:-jobmint_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M

  # 2. Redis 7 (Cache, Rate Limiting & Queue on OCI SSD)
  redis:
    image: redis:7-alpine
    container_name: jobmint-redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:-JobMintRedisPass2026!}
    volumes:
      - /data/redis:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-JobMintRedisPass2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M

networks:
  default:
    name: jobmint-network